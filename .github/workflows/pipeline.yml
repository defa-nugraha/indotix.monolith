name: pipeline

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install Node Dependencies
        run: npm ci

      - name: Audit Dependencies
        run: |
          composer audit --locked --no-interaction
          npm audit --audit-level=high

      - name: Run Pint
        run: composer lint

      - name: Format Frontend
        run: npm run format

      - name: Lint Frontend
        run: npm run lint

      - name: Build Assets
        run: npm run build

      - name: Type Check
        run: npm run types

  tests:
    name: Tests PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    needs: quality

    strategy:
      fail-fast: true
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Type Check
        run: npm run types

      - name: Tests
        run: ./vendor/bin/pest

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create .env for build
        run: |
          cat <<'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Install Node Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Security Audit
        run: |
          composer audit --locked --no-interaction
          npm audit --audit-level=high

      - name: Build Assets
        run: npm run build

      - name: Type Check
        run: npm run types

      - name: Install SSH deployment tools
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          set -euo pipefail

          for name in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS SSH_HOST SSH_USER SSH_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: ${name}"
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          set -euo pipefail

          SSH_OPTS="-i ~/.ssh/deploy_key -p ${SSH_PORT} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          ssh ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" "mkdir -p '${SSH_PATH}'"

          rsync -az --delete \
            -e "ssh ${SSH_OPTS}" \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='storage/' \
            --exclude='tests/' \
            --exclude='docs/' \
            --exclude='.env' \
            --exclude='database/database.sqlite' \
            --exclude='bootstrap/cache/*.php' \
            ./ "${SSH_USER}@${SSH_HOST}:${SSH_PATH%/}/"

      - name: Build and restart Docker services
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          set -euo pipefail

          SSH_OPTS="-i ~/.ssh/deploy_key -p ${SSH_PORT} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          if [ -z "${ENV_FILE:-}" ]; then
            echo "::error::Missing required GitHub secret: ENV_FILE"
            exit 1
          fi

          printf '%s\n' "${ENV_FILE}" | ssh ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" "cat > '${SSH_PATH%/}/.env' && chmod 600 '${SSH_PATH%/}/.env'"
          ssh ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" "cd '${SSH_PATH}' && docker compose -f docker-compose.prod.yml up -d --build --remove-orphans"
          ssh ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" "cd '${SSH_PATH}' && docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force"
          ssh ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" "cd '${SSH_PATH}' && docker compose -f docker-compose.prod.yml exec -T app php artisan optimize:clear"
          ssh ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" "cd '${SSH_PATH}' && docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache"
          ssh ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" "cd '${SSH_PATH}' && docker compose -f docker-compose.prod.yml exec -T app php artisan view:cache"
          ssh ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" "cd '${SSH_PATH}' && docker compose -f docker-compose.prod.yml exec -T queue php artisan queue:restart"

      - name: WhatsApp notify success
        if: success()
        continue-on-error: true
        env:
          WA_API_KEY: ${{ secrets.WA_API_KEY }}
          WA_SENDER: ${{ secrets.WA_SENDER }}
          WA_NUMBER: ${{ secrets.WA_NUMBER }}
        run: |
          message="Deploy sukses: ${{ github.repository }} (${{ github.ref_name }}) by ${{ github.actor }}. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS --connect-timeout 10 --max-time 20 -X POST "http://wa.digitalpelajar.id/send-message" \
            -H "Content-Type: application/json" \
            -d "{\"api_key\":\"${WA_API_KEY}\",\"sender\":\"${WA_SENDER}\",\"number\":\"${WA_NUMBER}\",\"message\":\"${message}\"}"

      - name: WhatsApp notify failure
        if: failure()
        continue-on-error: true
        env:
          WA_API_KEY: ${{ secrets.WA_API_KEY }}
          WA_SENDER: ${{ secrets.WA_SENDER }}
          WA_NUMBER: ${{ secrets.WA_NUMBER }}
        run: |
          message="Deploy gagal: ${{ github.repository }} (${{ github.ref_name }}) by ${{ github.actor }}. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS --connect-timeout 10 --max-time 20 -X POST "http://wa.digitalpelajar.id/send-message" \
            -H "Content-Type: application/json" \
            -d "{\"api_key\":\"${WA_API_KEY}\",\"sender\":\"${WA_SENDER}\",\"number\":\"${WA_NUMBER}\",\"message\":\"${message}\"}"
