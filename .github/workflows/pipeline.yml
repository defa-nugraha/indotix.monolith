name: Indotix CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the current main commit to production
        required: true
        type: choice
        options: ['no', production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'production' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate manifests
        run: composer validate --no-check-publish
      - name: Install PHP dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Install Node dependencies
        run: npm ci
      - name: Audit dependencies
        run: |
          composer audit --locked --no-interaction
          npm audit --audit-level=high
      - name: Check PHP syntax
        run: find app bootstrap config database routes -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build frontend
        run: npm run build
      - name: Type check
        run: npm run types

  tests:
    name: Test
    runs-on: ubuntu-latest
    needs: quality
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: indotix_laravel_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-ansi --no-interaction --prefer-dist --optimize-autoloader
      - run: npm ci
      - name: Configure test application
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mysql --host=127.0.0.1 --port=3306 --user=root --password=test -e "CREATE DATABASE IF NOT EXISTS indotix_laravel_testing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
      - run: npm run build
      - run: ./vendor/bin/pest

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.indotix.co.id
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/build-release
        with:
          artifact-name: indotix-release-${{ github.sha }}
          frontend-build-env: ${{ secrets.STAGING_FRONTEND_BUILD_ENV }}
      - uses: ./.github/actions/deploy-release
        with:
          artifact-name: indotix-release-${{ github.sha }}
          environment-name: staging
          ssh-host: ${{ secrets.STAGING_HOST }}
          ssh-port: ${{ secrets.STAGING_PORT }}
          ssh-user: ${{ secrets.STAGING_USER }}
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          deploy-root: ${{ secrets.STAGING_DEPLOY_ROOT }}
          expected-host: staging.indotix.co.id
          health-url: https://staging.indotix.co.id/up
          smoke-url: https://staging.indotix.co.id/wisata
          run-backup: 'false'

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: tests
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.deploy_production == 'production'
    environment:
      name: production
      url: https://indotix.co.id
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Confirm controlled production target
        run: |
          echo 'Target: PRODUCTION'
          echo 'Domain: indotix.co.id'
          echo 'Branch: main'
          echo 'Commit: ${{ github.sha }}'
      - uses: ./.github/actions/build-release
        with:
          artifact-name: indotix-release-${{ github.sha }}
          frontend-build-env: ${{ secrets.PRODUCTION_FRONTEND_BUILD_ENV }}
      - uses: ./.github/actions/deploy-release
        with:
          artifact-name: indotix-release-${{ github.sha }}
          environment-name: production
          ssh-host: ${{ secrets.PRODUCTION_HOST }}
          ssh-port: ${{ secrets.PRODUCTION_PORT }}
          ssh-user: ${{ secrets.PRODUCTION_USER }}
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          deploy-root: ${{ secrets.PRODUCTION_DEPLOY_ROOT }}
          expected-host: indotix.co.id
          health-url: https://indotix.co.id/up
          smoke-url: https://indotix.co.id/wisata
          run-backup: 'true'
