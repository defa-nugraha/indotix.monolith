name: Staging QA Sweep

on:
  push:
    branches:
      - qa/staging-full-20260917
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    name: Prepare staging QA fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: https://staging.indotix.co.id
    steps:
      - name: Configure staging SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/indotix_qa"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/indotix_qa"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Create repeatable QA fixtures in staging only
        env:
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          SSH_PORT: ${{ secrets.STAGING_PORT }}
          SSH_USER: ${{ secrets.STAGING_USER }}
          DEPLOY_ROOT: ${{ secrets.STAGING_DEPLOY_ROOT }}
          QA_ADMIN_PASSWORD: QaAdmin-${{ github.run_id }}!
          QA_USER_PASSWORD: QaUser-${{ github.run_id }}!
          QA_MITRA_PASSWORD: QaMitra-${{ github.run_id }}!
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_PORT"
          test -n "$SSH_USER"
          test -n "$DEPLOY_ROOT"
          test "$SSH_USER" != root

          cat > /tmp/indotix-qa-fixture.php <<'PHP'
          <?php
          declare(strict_types=1);

          $root = getenv('APP_ROOT');
          if (! $root || ! is_file($root.'/artisan')) {
              fwrite(STDERR, "Invalid APP_ROOT\n");
              exit(1);
          }

          require $root.'/vendor/autoload.php';
          $app = require $root.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          use App\Models\User;
          use App\Models\MitraWisataOnboarding;
          use App\Models\WisataTicket;
          use Illuminate\Support\Facades\Hash;
          use Illuminate\Support\Facades\DB;

          [$script, $adminPassword, $userPassword, $mitraPassword] = $argv;

          $onlyExisting = static function (string $table, array $values): array {
              $columns = array_flip(Schema::getColumnListing($table));
              return array_intersect_key($values, $columns);
          };

          DB::transaction(function () use ($adminPassword, $userPassword, $mitraPassword, $onlyExisting): void {
              $admin = User::query()->updateOrCreate(
                  ['email' => 'qa.e2e.admin@indotix.id'],
                  $onlyExisting('users', [
                      'name' => 'QA E2E Admin',
                      'phone' => '081200000001',
                      'password' => Hash::make($adminPassword),
                      'role' => 'admin',
                      'email_verified_at' => now(),
                      'is_suspended' => false,
                  ])
              );

              $user = User::query()->updateOrCreate(
                  ['email' => 'qa.e2e.user@indotix.id'],
                  $onlyExisting('users', [
                      'name' => 'QA E2E User',
                      'phone' => '081200000002',
                      'password' => Hash::make($userPassword),
                      'role' => 'user',
                      'email_verified_at' => now(),
                      'is_suspended' => false,
                  ])
              );

              $mitra = User::query()->updateOrCreate(
                  ['email' => 'qa.e2e.mitra@indotix.id'],
                  $onlyExisting('users', [
                      'name' => 'QA E2E Mitra',
                      'phone' => '081200000003',
                      'password' => Hash::make($mitraPassword),
                      'role' => 'mitra',
                      'mitra_onboarding_type' => 'wisata',
                      'email_verified_at' => now(),
                      'is_suspended' => false,
                  ])
              );

              $destination = MitraWisataOnboarding::query()->updateOrCreate(
                  ['user_id' => $mitra->id],
                  $onlyExisting('mitra_wisata_onboardings', [
                      'current_step' => 3,
                      'responsible_name' => 'QA E2E Mitra',
                      'responsible_phone' => '081200000003',
                      'responsible_role' => 'QA',
                      'destination_name' => 'QA E2E Wisata Staging',
                      'destination_type' => 'wisata_alam',
                      'description' => 'Fixture otomatis untuk pengujian staging Indotix. Aman untuk data QA.',
                      'highlights' => 'QA E2E automation fixture',
                      'address_full' => 'Staging QA Fixture, Indonesia',
                      'maps_pin_url' => 'https://maps.google.com/?q=-6.836,108.227',
                      'open_days' => ['senin','selasa','rabu','kamis','jumat','sabtu','minggu'],
                      'open_time' => '08:00',
                      'close_time' => '17:00',
                      'facilities' => ['toilet','parkir'],
                      'contact_phone' => '081200000003',
                      'contact_hours' => '08:00-17:00',
                      'verification_status' => 'verified',
                      'verification_reason' => null,
                      'payout_status' => 'verified',
                      'payout_reason' => null,
                      'bank_name' => 'BANK QA',
                      'bank_account_number' => '1234567890',
                      'bank_account_name' => 'QA E2E MITRA',
                      'is_live' => true,
                      'is_suspended' => false,
                      'is_temporarily_closed' => false,
                      'content_hidden' => false,
                  ])
              );

              $single = WisataTicket::query()->updateOrCreate(
                  [
                      'mitra_wisata_onboarding_id' => $destination->id,
                      'name' => 'QA E2E General Admission',
                  ],
                  $onlyExisting('wisata_tickets', [
                      'description' => 'Single ticket fixture for staging QA',
                      'price' => 10000,
                      'quota' => 1000,
                      'daily_quota' => 100,
                      'ticket_type' => 'perorangan',
                      'ticket_kind' => 'single',
                      'is_entry_ticket' => true,
                      'package_items' => null,
                      'valid_from' => now()->subDay()->toDateString(),
                      'valid_until' => now()->addDays(30)->toDateString(),
                      'refund_policy' => 'QA fixture refundable according to staging rules',
                      'min_order_quantity' => 1,
                      'max_order_quantity' => 20,
                      'is_active' => true,
                      'is_closed' => false,
                  ])
              );

              WisataTicket::query()->updateOrCreate(
                  [
                      'mitra_wisata_onboarding_id' => $destination->id,
                      'name' => 'QA E2E Family Package',
                  ],
                  $onlyExisting('wisata_tickets', [
                      'description' => 'Package fixture for staging QA',
                      'price' => 20000,
                      'quota' => 500,
                      'daily_quota' => 50,
                      'ticket_type' => 'grup',
                      'ticket_kind' => 'package',
                      'is_entry_ticket' => true,
                      'package_items' => [
                          ['ticket_id' => (int) $single->id, 'quantity' => 2],
                      ],
                      'valid_from' => now()->subDay()->toDateString(),
                      'valid_until' => now()->addDays(30)->toDateString(),
                      'refund_policy' => 'QA fixture refundable according to staging rules',
                      'min_order_quantity' => 1,
                      'max_order_quantity' => 10,
                      'is_active' => true,
                      'is_closed' => false,
                  ])
              );

              echo json_encode([
                  'admin_id' => $admin->id,
                  'user_id' => $user->id,
                  'mitra_id' => $mitra->id,
                  'destination_id' => $destination->id,
                  'single_ticket_id' => $single->id,
              ], JSON_UNESCAPED_SLASHES).PHP_EOL;
          });
          PHP

          scp -q             -i "$HOME/.ssh/indotix_qa"             -P "$SSH_PORT"             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             /tmp/indotix-qa-fixture.php             "$SSH_USER@$SSH_HOST:$DEPLOY_ROOT/incoming/indotix-qa-fixture.php"

          ssh             -i "$HOME/.ssh/indotix_qa"             -p "$SSH_PORT"             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             "$SSH_USER@$SSH_HOST"             "set -e; APP_ROOT='$DEPLOY_ROOT/current' php '$DEPLOY_ROOT/incoming/indotix-qa-fixture.php' '$QA_ADMIN_PASSWORD' '$QA_USER_PASSWORD' '$QA_MITRA_PASSWORD'; rm -f '$DEPLOY_ROOT/incoming/indotix-qa-fixture.php'"

  qa:
    name: Full staging QA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: fixture
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ensure Chromium is available
        run: npx puppeteer browsers install chrome
      - name: Run full staging QA sweep
        env:
          STAGING_BASE_URL: https://staging.indotix.co.id
          QA_USER_EMAIL: qa.e2e.user@indotix.id
          QA_USER_PASSWORD: QaUser-${{ github.run_id }}!
          QA_ADMIN_EMAIL: qa.e2e.admin@indotix.id
          QA_ADMIN_PASSWORD: QaAdmin-${{ github.run_id }}!
          QA_MITRA_EMAIL: qa.e2e.mitra@indotix.id
          QA_MITRA_PASSWORD: QaMitra-${{ github.run_id }}!
        run: node scripts/staging-qa.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-qa-full-${{ github.sha }}
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 14
