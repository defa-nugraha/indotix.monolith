name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create .env for build
        run: |
          cat <<'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Install Node Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Build Assets
        run: npm run build

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] && [ -z "$SSH_PRIVATE_KEY_B64" ]; then
            echo "Missing SSH key. Please set SSH_PRIVATE_KEY or SSH_PRIVATE_KEY_B64."
            exit 1
          fi
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "Missing SSH secrets. Please set SSH_HOST and SSH_USER."
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY_B64" ]; then
            echo "$SSH_PRIVATE_KEY_B64" | base64 -d > "$HOME/.ssh/id_rsa"
          else
            # Try raw first (proper multiline key)
            printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_rsa"
            # If key still invalid (often stored with literal \n), rehydrate it
            if ! ssh-keygen -y -f "$HOME/.ssh/id_rsa" >/dev/null 2>&1; then
              printf '%b' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_rsa"
            fi
          fi
          chmod 600 "$HOME/.ssh/id_rsa"
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude ".env" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "vendor" \
            --exclude "storage" \
            --exclude "tests" \
            --exclude "docs" \
            -e "ssh -i $HOME/.ssh/id_rsa -o IdentitiesOnly=yes -p ${SSH_PORT:-22}" \
            ./ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH%/}/"

      - name: Run post-deploy commands
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i "$HOME/.ssh/id_rsa" -o IdentitiesOnly=yes -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" <<EOF
            set -e
            cd "${DEPLOY_PATH%/}"
            composer install --no-dev --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan optimize
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link || true
            php artisan queue:restart || true
          EOF

      - name: WhatsApp notify success
        if: success()
        continue-on-error: true
        env:
          WA_API_KEY: ${{ secrets.WA_API_KEY }}
          WA_SENDER: ${{ secrets.WA_SENDER }}
          WA_NUMBER: ${{ secrets.WA_NUMBER }}
        run: |
          message="✅ Deploy sukses: ${{ github.repository }} (${{
            github.ref_name
          }}) by ${{ github.actor }}. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS --connect-timeout 10 --max-time 20 -X POST "http://wa.digitalpelajar.id/send-message" \
            -H "Content-Type: application/json" \
            -d "{\"api_key\":\"${WA_API_KEY}\",\"sender\":\"${WA_SENDER}\",\"number\":\"${WA_NUMBER}\",\"message\":\"${message}\"}"

      - name: WhatsApp notify failure
        if: failure()
        continue-on-error: true
        env:
          WA_API_KEY: ${{ secrets.WA_API_KEY }}
          WA_SENDER: ${{ secrets.WA_SENDER }}
          WA_NUMBER: ${{ secrets.WA_NUMBER }}
        run: |
          message="❌ Deploy gagal: ${{ github.repository }} (${{
            github.ref_name
          }}) by ${{ github.actor }}. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS --connect-timeout 10 --max-time 20 -X POST "http://wa.digitalpelajar.id/send-message" \
            -H "Content-Type: application/json" \
            -d "{\"api_key\":\"${WA_API_KEY}\",\"sender\":\"${WA_SENDER}\",\"number\":\"${WA_NUMBER}\",\"message\":\"${message}\"}"
