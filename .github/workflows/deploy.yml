name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create .env for build
        run: |
          cat <<'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Install Node Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Security Audit
        run: |
          composer audit --locked --no-interaction
          npm audit --audit-level=high

      - name: Type Check
        run: npm run types

      - name: Build Assets
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_PATH }}
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/storage/**
            **/tests/**
            **/docs/**
            .env

      - name: WhatsApp notify success
        if: success()
        continue-on-error: true
        env:
          WA_API_KEY: ${{ secrets.WA_API_KEY }}
          WA_SENDER: ${{ secrets.WA_SENDER }}
          WA_NUMBER: ${{ secrets.WA_NUMBER }}
        run: |
          message="✅ Deploy sukses: ${{ github.repository }} (${{
            github.ref_name
          }}) by ${{ github.actor }}. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS --connect-timeout 10 --max-time 20 -X POST "http://wa.digitalpelajar.id/send-message" \
            -H "Content-Type: application/json" \
            -d "{\"api_key\":\"${WA_API_KEY}\",\"sender\":\"${WA_SENDER}\",\"number\":\"${WA_NUMBER}\",\"message\":\"${message}\"}"

      - name: WhatsApp notify failure
        if: failure()
        continue-on-error: true
        env:
          WA_API_KEY: ${{ secrets.WA_API_KEY }}
          WA_SENDER: ${{ secrets.WA_SENDER }}
          WA_NUMBER: ${{ secrets.WA_NUMBER }}
        run: |
          message="❌ Deploy gagal: ${{ github.repository }} (${{
            github.ref_name
          }}) by ${{ github.actor }}. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS --connect-timeout 10 --max-time 20 -X POST "http://wa.digitalpelajar.id/send-message" \
            -H "Content-Type: application/json" \
            -d "{\"api_key\":\"${WA_API_KEY}\",\"sender\":\"${WA_SENDER}\",\"number\":\"${WA_NUMBER}\",\"message\":\"${message}\"}"
