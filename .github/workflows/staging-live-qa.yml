name: Staging Live QA

on:
  push:
    branches:
      - qa/staging-live-20260917
  workflow_dispatch:

concurrency:
  group: staging-live-qa
  cancel-in-progress: true

jobs:
  staging-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright runtime
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Run live staging QA
        env:
          QA_BASE_URL: https://staging.indotix.co.id
          QA_SEED_PASSWORD: password
        run: node qa/staging-live-qa.mjs

      - name: Upload QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-live-qa-results
          path: qa-results/staging-live-results.json
          if-no-files-found: warn
